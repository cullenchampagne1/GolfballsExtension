<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Custom Pages Sandbox — Golfballs Extension</title>
<!-- Quick token seed; the page bundles also inject the full theme.css via ensureTheme(). -->
<script src="theme-init.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0b0c; overflow: hidden;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
</style>
</head>
<body>
  <!-- The schema engine (window.__gbPageEngine.runEngine) — so the sandbox can
       extract data from a real saved CRM HTML and test the engine too. -->
  <script src="react-dist/vanilla/page-engine.js"></script>
  <!-- The REAL page bundles. On load they call ensureTheme() (injects theme.css)
       and register window.__gbCustomPages[id].render(el, { store }). -->
  <script src="react-dist/content/contact-details.js"></script>
  <script src="react-dist/content/account-details.js"></script>
  <!-- Sandbox controller: fake store + page/state switcher. -->
  <script src="react-dist/playground/custom-pages-sandbox.js"></script>
</body>
</html>
